{% extends 'diagnosis/base.html' %}

{% block content %}
<div class="auth-container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="auth-left" style="max-width: 400px; width: 100%; text-align: center; background: rgba(255,255,255,0.2); padding: 40px; border-radius: 15px;">
        <div style="font-size: 50px; color: #28a745; margin-bottom: 20px;">✓</div>
        <h2 class="auth-title">Пароль змінено!</h2>
        <p style="margin: 20px 0;">Ваш новий пароль було успішно встановлено.</p>
        <a href="{% url 'accounts:profile' %}" class="btn" style="display: inline-block; text-decoration: none;">До профілю</a>
    </div>
</div>
{% endblock %}
