{% extends 'diagnosis/base.html' %}

{% block content %}
<div class="auth-container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="auth-left" style="max-width: 400px; width: 100%; background: rgba(255,255,255,0.2); padding: 30px; border-radius: 15px;">
        <h2 class="auth-title" style="margin-bottom: 20px; text-align: center;">Password change</h2>
        
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% for field in form %}
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: #d9534f; font-size: 0.8rem; margin-top: 5px;">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Update password</button>
        </form>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="{% url 'accounts:profile' %}" style="text-decoration: none; color: var(--text-color); font-size: 0.9rem;">← Back to profile</a>
        </div>
    </div>
</div>
{% endblock %}
