[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
pythonpath = .
markers =
    integration: tests that hit the database, real files, or ML model
    unit: fast, isolated tests without DB or external services
filterwarnings = 
    ignore::DeprecationWarning:gast.*
    ignore::UserWarning:tensorflow_hub.*
addopts = -v